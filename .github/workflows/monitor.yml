name: Crypto Signal Monitor v3.7.1
# Package revision: v3.7.1-tw-only-r2

on:
  workflow_dispatch:
    inputs:
      send_discord:
        description: "Bericht an Discord senden"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: crypto-signal-monitor-v371
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repository laden
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Paper-State-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: output/paper_state.json
          key: paper-state-v371-${{ github.run_id }}
          restore-keys: |
            paper-state-v371-
            paper-state-v37-
      - name: Paper-State wiederherstellen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python paper_state_store.py restore output/paper_state.json
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Lighter-Analyse ausführen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: ${{ inputs.send_discord }}
        run: python main.py
      - name: Paper-State sichern
        if: always() && hashFiles('output/paper_state.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python paper_state_store.py checkpoint output/paper_state.json --interval-hours 6
      - name: Paper-State-Cache speichern
        if: always() && hashFiles('output/paper_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/paper_state.json
          key: paper-state-v371-${{ github.run_id }}
