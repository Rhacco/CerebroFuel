name: Crypto Signal Monitor v7.2.0
on:
  workflow_dispatch:
    inputs:
      send_discord:
        description: "Bericht an Discord senden"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: crypto-signal-monitor-v7.2.0
  cancel-in-progress: false
  queue: single

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repository laden
        uses: actions/checkout@v7
      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Laufzeit-State laden
        uses: actions/cache/restore@v6
        with:
          path: |
            output/event_cache.json
            output/event_display_state.json
            output/incident_state.json
            output/signal_transition_state.json
            output/daily_candle_cache.json
            output/springer_history.json
            output/display_selection_state.json
          key: monitor-state-7-2-0-${{ github.run_id }}
          restore-keys: |
            monitor-state-7-2-0-
      - name: Lighter-Analyse ausführen
        id: monitor
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: ${{ inputs.send_discord }}
          CRYPTO_EVENTS_URL: ${{ secrets.CRYPTO_EVENTS_URL }}
        run: python main.py
      - name: Laufzeit-State speichern
        if: ${{ always() && hashFiles('output/runtime_state_ready') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            output/event_cache.json
            output/event_display_state.json
            output/incident_state.json
            output/signal_transition_state.json
            output/daily_candle_cache.json
            output/springer_history.json
            output/display_selection_state.json
          key: monitor-state-7-2-0-${{ github.run_id }}
      - name: Analysefehler weitergeben
        if: ${{ always() && steps.monitor.outcome == 'failure' }}
        run: exit 1
