name: Crypto Signal Monitor v3.9.0
# Package revision: v3.9.0-extremity-reclaim-r1

on:
  workflow_dispatch:
    inputs:
      send_discord:
        description: "Bericht an Discord senden"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: crypto-signal-monitor-v390
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repository laden
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Laufzeit-State-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: |
            output/paper_state.json
            output/notification_state.json
            output/event_cache.json
            output/event_display_state.json
            output/parameter_review.json
          key: runtime-state-v390-${{ github.run_id }}
          restore-keys: |
            runtime-state-v390-
            runtime-state-v385-
            runtime-state-v384-
            runtime-state-v383-
            runtime-state-v382-
            runtime-state-v381-
            paper-state-v371-
      - name: Paper-State wiederherstellen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python paper_state_store.py restore output/paper_state.json
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Lighter-Analyse ausführen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: ${{ inputs.send_discord }}
          CRYPTO_EVENTS_URL: ${{ secrets.CRYPTO_EVENTS_URL }}
          CRYPTO_EVENTS_JSON: ${{ secrets.CRYPTO_EVENTS_JSON }}
        run: python main.py
      - name: Paper-State sichern
        if: always() && hashFiles('output/paper_state.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python paper_state_store.py checkpoint output/paper_state.json --interval-hours 6
      - name: Laufzeit-State-Cache speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/paper_state.json
            output/notification_state.json
            output/event_cache.json
            output/event_display_state.json
            output/parameter_review.json
          key: runtime-state-v390-${{ github.run_id }}
